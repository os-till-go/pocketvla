# G3 — dense reward: +0.3 for closing the gripper inside the grasp window (empty-handed).
# The ONLY difference from configs/grpo_3m_g1.yaml is `inwin_bonus: 0.3`.
#
# Why this term: behavior_diff.py showed the SFT failure mode is not "fails to
# approach" (median nearest distance 0.105 vs threshold 0.09) but "oscillates next
# to the ball and never closes inside the window" (11.5 direction reversals per
# failed episode). The original reward only pays on final success, so these
# failures produce ~identical rewards -> zero group advantage -> no gradient.
# This term pays exactly the missing intermediate event.
seed: 42
data:
  dataset_dir: dataset
model:
  size: 3m
  use_aux_heads: true
  d_model: 160
  n_layer: 3
  d_ff: 1024
  ch:
  - 24
  - 48
  - 72
  - 96
  - 96
  extra_blocks: 4
  act_hidden:
  - 1280
  - 640
  ground_hidden: 48
grpo:
  ckpt: outputs_sft_3m/train/pocketvla-3m
  test_set: dataset/test.npz
  output_dir: outputs_grpo_3m_g3
  iterations: 100
  group_size: 8
  lr: 2.5e-05
  episodes: 3000
  eval_every: 0
  gifs: 30
  steps_per_domain: 20
  aux_weight: 0.5
  kl_coef: 2.0
  early_stop: 0
  inwin_bonus: 0.3
