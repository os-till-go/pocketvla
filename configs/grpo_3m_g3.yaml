# G3 — dense reward: +0.3 for closing the gripper inside the grasp window (empty-handed).
# Same training budget as G1; differs in inwin_bonus and output_dir.
#
# Hypothesis: a bonus for an intermediate close command may help grasping.
# Original reward already includes grasp, distance, speed and wrong-grasp terms.
# Current bonus checks PRE-action target distance, unlike the simulator's
# POST-joint-update nearest-ball grasp test. See docs/experiments.md for limits.
seed: 42
data:
  dataset_dir: dataset
model:
  size: 3m
  use_aux_heads: true
  d_model: 160
  n_layer: 3
  d_ff: 1024
  ch:
  - 24
  - 48
  - 72
  - 96
  - 96
  extra_blocks: 4
  act_hidden:
  - 1280
  - 640
  ground_hidden: 48
grpo:
  ckpt: outputs_sft_3m/train/pocketvla-3m
  test_set: dataset/test.npz
  output_dir: outputs_grpo_3m_g3
  iterations: 100
  group_size: 8
  lr: 2.5e-05
  episodes: 3000
  eval_every: 0
  gifs: 30
  steps_per_domain: 20
  aux_weight: 0.5
  kl_coef: 2.0
  early_stop: 0
  inwin_bonus: 0.3
